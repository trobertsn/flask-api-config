# Service — gives the Flask API pods a stable internal address
apiVersion: v1
kind: Service
metadata:
  name: flask-api
  namespace: flask-api
spec:
  selector:
    app: flask-api             # routes to pods with this label
  ports:
    - port: 80                 # service listens on 80
      targetPort: 8080         # forwards to container's 8080
  type: ClusterIP
