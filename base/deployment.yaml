# base deployment — the COMMON spec shared by all environments
# No namespace here (overlays set it), replicas defaulted (overlays override)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
        - name: flask-api
          image: ghcr.io/trobertsn/flask-api:latest
          ports:
            - containerPort: 8080
          # --- DATABASE CONNECTION ---
          env:
            # Non-secret connection details — fine to have in git
            - name: DB_HOST
              value: postgresql.database.svc.cluster.local   # postgres service, cross-namespace DNS
            - name: DB_NAME
              value: flaskapi
            - name: DB_USER
              value: flaskapi
            # The password comes from a Secret at runtime — never in git
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql     # Secret must exist in the SAME namespace as this pod
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
